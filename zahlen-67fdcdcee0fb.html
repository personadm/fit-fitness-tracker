<!doctype html><html lang="de"><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>fin Zahlen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: Kopfzeile mit Stand, dann "Heute" als Kachelraster, "Bestand jetzt",
   "Verlauf" mit zwei Diagrammen und die Tagestabelle; eine Spalte, hoechstens 1120px. */
:root {
  --bg: #F6F4F4;
  --flaeche: #FFFFFF;
  --flaeche-2: #F0EDED;
  --tinte: #0B090A;
  --tinte-2: #574F51;
  --tinte-3: #857C7E;
  --linie: #E2DCDD;
  --akzent: #BA181B;
  --akzent-zeichen: #BA181B;
  --akzent-flaeche: rgba(186, 24, 27, .07);
  --gut: #2B7A12;
  --gut-spur: #DDEAD9;
  --warn: #9A5800;
  --schlecht: #B3261E;
  --ios: #2a78d6;
  --android: #1baf7a;
  --mann: #2a78d6;
  --frau: #eb6834;
  --divers: #1baf7a;
  --ohne: #BDB5B7;
  --balken: #C9C1C3;
  --fokus: #2a78d6;
  /* Creator (148): feste Reihenfolge 1 bis 5, 0 = Rest; Abo und Stand */
  --k1: #2a78d6; --k2: #eb6834; --k3: #1baf7a; --k4: #eda100; --k5: #e87ba4; --k0: #BDB5B7;
  --jahr: #BA181B; --monat: #E39A9B; --probe: #857C7E; --frei: #D9D2D3;
  --schrift: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B090A;
    --flaeche: #161A1D;
    --flaeche-2: #1D2125;
    --tinte: #F5F3F4;
    --tinte-2: #B1A7A6;
    --tinte-3: #8A8182;
    --linie: #2A2F33;
    --akzent: #BA181B;
    --akzent-zeichen: #F05A5D;
    --akzent-flaeche: rgba(240, 90, 93, .10);
    --gut: #5BC236;
    --gut-spur: #243C22;
    --warn: #E0A030;
    --schlecht: #F05A5D;
    --ios: #3987e5;
    --android: #199e70;
    --mann: #3987e5;
    --frau: #d95926;
    --divers: #199e70;
    --ohne: #5D5759;
    --balken: #4A4446;
    --fokus: #3987e5;
    --k1: #3987e5; --k2: #d95926; --k3: #199e70; --k4: #c98500; --k5: #d55181; --k0: #5D5759;
    --jahr: #F05A5D; --monat: #8E3B3D; --probe: #8A8182; --frei: #3A3536;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B090A;
  --flaeche: #161A1D;
  --flaeche-2: #1D2125;
  --tinte: #F5F3F4;
  --tinte-2: #B1A7A6;
  --tinte-3: #8A8182;
  --linie: #2A2F33;
  --akzent: #BA181B;
  --akzent-zeichen: #F05A5D;
  --akzent-flaeche: rgba(240, 90, 93, .10);
  --gut: #5BC236;
  --gut-spur: #243C22;
  --warn: #E0A030;
  --schlecht: #F05A5D;
  --ios: #3987e5;
  --android: #199e70;
  --mann: #3987e5;
  --frau: #d95926;
  --divers: #199e70;
  --ohne: #5D5759;
  --balken: #4A4446;
  --fokus: #3987e5;
  --k1: #3987e5; --k2: #d95926; --k3: #199e70; --k4: #c98500; --k5: #d55181; --k0: #5D5759;
  --jahr: #F05A5D; --monat: #8E3B3D; --probe: #8A8182; --frei: #3A3536;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--tinte);
  font-family: var(--schrift);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.seite {
  max-width: 1120px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: grid;
  gap: 28px;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fokus); outline-offset: 2px; border-radius: 6px; }
.zahl { font-variant-numeric: tabular-nums; }

/* Kopf */
.kopf { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.marke { display: grid; gap: 2px; min-width: 0; }
.marke h1 {
  margin: 0;
  font-size: 30px;
  line-height: 1.05;
  font-weight: 800;
  font-stretch: 112%;
  letter-spacing: -.01em;
  text-wrap: balance;
}
.marke h1 b { color: var(--akzent-zeichen); font-weight: 800; }
.datum { color: var(--tinte-2); font-size: 14px; }
.steuer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.stand { color: var(--tinte-2); font-size: 13px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px 3px 8px; border-radius: 999px;
  font-size: 12px; font-weight: 700; font-stretch: 90%;
  letter-spacing: .06em; text-transform: uppercase;
  background: var(--flaeche-2); color: var(--tinte-2);
}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip[data-art="live"] { color: var(--gut); }
.chip[data-art="laedt"] { color: var(--tinte-3); }
.chip[data-art="fehler"] { color: var(--schlecht); }
.chip[data-art="beispiel"] { color: var(--warn); }
.chip[data-art="alt"] { color: var(--warn); }
.knopf {
  appearance: none; border: 1px solid var(--linie); background: var(--flaeche);
  padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600;
}
.knopf:hover { border-color: var(--tinte-3); }
.knopf[disabled] { opacity: .55; cursor: default; }
.knopf.voll { background: var(--akzent); border-color: var(--akzent); color: #FFFFFF; }
.knopf.voll:hover { filter: brightness(1.08); }

/* Hinweise und Fehler */
.meldung {
  display: grid; gap: 4px; padding: 12px 16px; border-radius: 12px;
  background: var(--akzent-flaeche); border: 1px solid var(--linie);
}
.meldung[data-art="beispiel"] { background: var(--flaeche-2); }
.meldung strong { font-weight: 700; }
.meldung p { margin: 0; color: var(--tinte-2); font-size: 14px; }
.meldung .knopfreihe { margin-top: 6px; }

/* Zugang */
.zugang {
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  padding: 18px; display: grid; gap: 14px; max-width: 640px;
}
.zugang h2 { margin: 0; font-size: 18px; font-weight: 700; }
.feld { display: grid; gap: 6px; }
.feld label { font-size: 13px; font-weight: 600; color: var(--tinte-2); }
.feld input {
  width: 100%; min-width: 0; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--linie); background: var(--bg); font-size: 15px;
}
.klein { font-size: 13px; color: var(--tinte-3); margin: 0; }
.knopfreihe { display: flex; flex-wrap: wrap; gap: 8px; }

/* Abschnitte */
section { display: grid; gap: 12px; min-width: 0; }
.abschnitt-kopf { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
h2.titel {
  margin: 0; font-size: 13px; font-weight: 700; font-stretch: 88%;
  letter-spacing: .09em; text-transform: uppercase; color: var(--tinte-2);
}
.nebenbei { font-size: 13px; color: var(--tinte-3); }
.inhalt { display: grid; gap: 28px; min-width: 0; }

/* Kacheln Heute */
.kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.kachel {
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  padding: 14px 14px 12px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 4px; min-width: 0;
}
.kachel .name { font-size: 13px; font-weight: 600; color: var(--tinte-2); }
.kachel .wert { font-size: 34px; line-height: 1.05; font-weight: 750; font-stretch: 108%; letter-spacing: -.01em; }
.kachel .teil { font-size: 12.5px; color: var(--tinte-3); overflow-wrap: anywhere; }
.kachel .fuss { display: grid; gap: 4px; margin-top: 6px; }
.kachel .vergleich { font-size: 12px; color: var(--tinte-3); }
.funke { display: block; width: 100%; height: 30px; }

/* Heute ins bezahlte Abo: breite Karte vor den Kacheln. Links die Zahl mit
   Balken, rechts (ab 760px) die Produkte; schmal klappt die Tabelle auf. */
.ins {
  grid-column: 1 / -1;
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  padding: 16px; display: grid; gap: 12px 32px; min-width: 0;
}
.ins-links { display: grid; gap: 6px; align-content: start; min-width: 0; }
.ins .name { font-size: 13px; font-weight: 600; color: var(--tinte-2); }
.ins-wert { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.ins-wert b { font-size: 44px; line-height: 1.05; font-weight: 800; font-stretch: 108%; letter-spacing: -.01em; }
.ins-wert span { font-size: 20px; font-weight: 650; color: var(--tinte-2); }
.ins-balken { height: 10px; border-radius: 5px; background: var(--gut-spur); overflow: hidden; margin: 4px 0 2px; }
.ins-balken i { display: block; height: 100%; border-radius: 5px; background: var(--gut); }
.ins-teile { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 13.5px; color: var(--tinte-2); }
.ins-teile b { color: var(--tinte); font-weight: 700; }
.ins-hinweis { font-size: 12.5px; font-weight: 600; color: var(--warn); }
.ins-schalter {
  appearance: none; border: 0; background: none; padding: 4px 0; justify-self: start; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--tinte);
}
.ins-schalter::after {
  content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0;
  transform: translateY(-2px) rotate(45deg);
}
.ins-schalter[aria-expanded="true"]::after { transform: translateY(1px) rotate(-135deg); }
.ins-tabelle { display: none; min-width: 0; }
.ins.auf .ins-tabelle { display: block; }
.ins-tabelle table { font-size: 13.5px; }
.ins-tabelle th, .ins-tabelle td { padding: 6px 8px; }
.ins-tabelle tbody th { font-weight: 500; }
.ins-tabelle tr.summe th { font-weight: 700; }
.ins-tabelle tbody tr:last-child th { border-bottom: 0; }
@media (min-width: 760px) {
  .ins { grid-template-columns: minmax(260px, 1fr) minmax(0, 1.3fr); align-items: start; }
  .ins-schalter { display: none; }
  .ins-tabelle { display: block; }
}

/* Bestand. dense: die breite Karte Geschlecht steht im Code gleich nach dem
   Ueberblick (schmal also direkt darunter), breit rutscht sie in die naechste Reihe. */
.bestand { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); grid-auto-flow: dense; gap: 10px; }
.karte {
  background: var(--flaeche); border: 1px solid var(--linie); border-radius: var(--radius);
  padding: 16px; display: grid; gap: 12px; align-content: start; min-width: 0;
}
.karte h3 { margin: 0; font-size: 15px; font-weight: 700; }
.paare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 0; }
.paare div { display: grid; gap: 1px; min-width: 0; align-content: start; }
.paare dt { font-size: 12.5px; color: var(--tinte-2); }
.paare dd { margin: 0; font-size: 22px; font-weight: 700; font-stretch: 106%; }
.paare dd small { display: block; font-size: 12.5px; font-weight: 500; color: var(--tinte-3); font-stretch: 100%; }
.tabelle-huelle { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 7px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--linie); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
thead th { font-size: 12px; font-weight: 600; color: var(--tinte-2); }
tbody tr:last-child td { border-bottom: 0; }
tr.summe td { font-weight: 700; }
td.null { color: var(--tinte-3); }
.liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.liste li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
.liste li span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Geschlecht (145): je Gruppe ein gestapelter Balken mit 2px Luft, darunter
   die Zahlen als Tabelle; die Farbfelder dort sind zugleich die Legende. */
.karte.breit { grid-column: 1 / -1; }
.g-kopf { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.g-hinweis { margin: 0; font-size: 12.5px; font-weight: 600; color: var(--warn); }
.g-leer { margin: 0; font-size: 14px; color: var(--tinte-3); }
.g-gruppen { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px 32px; }
.g-gruppe { display: grid; gap: 8px; min-width: 0; align-content: start; }
.g-name { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.g-name h4 { margin: 0; font-size: 13.5px; font-weight: 700; }
.g-name span { font-size: 13px; color: var(--tinte-3); }
.g-huelle { position: relative; }
.g-balken { display: flex; gap: 2px; height: 12px; border-radius: 4px; overflow: hidden; }
.g-balken.leer { background: var(--flaeche-2); }
.g-balken i { display: block; flex: 0 1 0; min-width: 3px; }
.g-huelle .tipp { top: 20px; }
.g-tabelle table { font-size: 13.5px; }
.g-tabelle th, .g-tabelle td { padding: 5px 8px; }
.g-tabelle tbody th { font-weight: 500; }
.g-tabelle tbody tr:last-child th { border-bottom: 0; }
.g-tabelle tbody td:last-child { font-weight: 650; }
.g-farbe { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }

/* Verlauf */
.diagramme { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; }
.diagramm { position: relative; }
.diagramm svg { display: block; width: 100%; height: auto; overflow: visible; }
.diagramm text { fill: var(--tinte-3); font-family: var(--schrift); font-size: 11px; }
.legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--tinte-2); }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legende i.strich { height: 3px; border-radius: 2px; width: 14px; }
.tipp {
  position: absolute; pointer-events: none; z-index: 2; min-width: 140px;
  background: var(--tinte); color: var(--bg); border-radius: 10px; padding: 8px 10px;
  font-size: 12.5px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0, 0, 0, .18);
}
.tipp b { display: block; font-size: 12px; margin-bottom: 2px; }
.tipp div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }

details.wie { font-size: 13.5px; color: var(--tinte-2); }
details.wie summary { cursor: pointer; font-weight: 600; color: var(--tinte); }
details.wie ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; max-width: 72ch; }

@media (max-width: 520px) {
  .marke h1 { font-size: 26px; }
  .kachel .wert { font-size: 28px; }
  .ins-wert b { font-size: 38px; }
  .ins-tabelle table { font-size: 12.5px; }
  .ins-tabelle thead th { font-size: 11.5px; }
  .ins-tabelle th, .ins-tabelle td { padding: 6px 4px; }
  .ins-tabelle th:first-child { padding-left: 0; }
  .g-tabelle table { font-size: 12.5px; }
  .g-tabelle thead th { font-size: 11.5px; }
  .g-tabelle th, .g-tabelle td { padding: 5px 4px; }
  .g-tabelle th:first-child { padding-left: 0; }
  .kacheln { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .diagramme { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .chip[data-art="laedt"]::before { animation: puls 1s ease-in-out infinite alternate; }
  @keyframes puls { from { opacity: .35; } to { opacity: 1; } }
}

/* ================================================================ Creator (148, Variante 3)
   Eigener Bereich nach </main>: Kopf, Steuerleiste, Ueberblick, Karten je
   Creator, Auszahlungsliste; dazu vier Dialoge (Detail, Anlegen, Auszahlen,
   Rueckfrage). Bausteine aus pruef-affiliate-dashboard-v3.html. */
a.knopf { display: inline-flex; align-items: center; text-decoration: none; color: var(--tinte); }
select, textarea { font: inherit; color: inherit; }
.creator { gap: 16px; }
.creator .cr-kopfzeile { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.creator .cr-titelzeile { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; min-width: 0; }
.creator .cr-titelzeile .chip { align-self: center; }
.cr-koerper { display: grid; gap: 24px; min-width: 0; }
h3.titel {
  margin: 0; font-size: 13px; font-weight: 700; font-stretch: 88%;
  letter-spacing: .09em; text-transform: uppercase; color: var(--tinte-2);
}
.hinweis { font-size: 13px; font-weight: 600; color: var(--warn); margin: 0; }
.meldung.erfolg { background: var(--flaeche); border-color: var(--gut); }
.meldung.erfolg p, .meldung.erfolg { color: var(--tinte); }

.steuerleiste { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.gruppe { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.gruppe > .lbl { font-size: 11.5px; font-weight: 700; font-stretch: 88%; letter-spacing: .09em; text-transform: uppercase; color: var(--tinte-3); }
.segment { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 999px; background: var(--flaeche-2); border: 1px solid var(--linie); }
.segment button { appearance: none; border: 0; background: none; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--tinte-2); white-space: nowrap; }
.segment button:hover { color: var(--tinte); }
.segment button[aria-pressed="true"] { background: var(--flaeche); color: var(--tinte); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.cr-monat { display: inline-flex; align-items: center; gap: 4px; }
.cr-monat span { min-width: 118px; text-align: center; font-weight: 650; font-size: 14px; }
.pfeil { appearance: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--linie); background: var(--flaeche); cursor: pointer; font-size: 18px; line-height: 1; padding: 0 0 2px; }
.pfeil[disabled] { opacity: .35; cursor: default; }

.cr { display: flex; align-items: center; gap: 10px; min-width: 0; text-align: left; }
.cr-text { display: grid; gap: 1px; min-width: 0; }
.cr-name { font-weight: 650; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; min-width: 0; }
.cr-name > span:first-child { overflow-wrap: anywhere; }
.cr-neben { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 12.5px; color: var(--tinte-3); overflow-wrap: anywhere; }
.bild { width: 34px; height: 34px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; overflow: hidden; font-size: 12.5px; font-weight: 750; letter-spacing: .02em; color: var(--tinte); background: var(--flaeche-2); box-shadow: inset 0 0 0 3px var(--kf, var(--k0)); }
.bild.gross { width: 52px; height: 52px; font-size: 17px; box-shadow: inset 0 0 0 4px var(--kf, var(--k0)); }
.bild img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; padding: 4px; }
.code { font-size: 11px; font-weight: 750; letter-spacing: .07em; padding: 0 6px; border-radius: 5px; background: var(--flaeche-2); color: var(--tinte-2); border: 1px solid var(--linie); line-height: 18px; white-space: nowrap; }
.aus, .tag { font-size: 10.5px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; padding: 0 6px; border-radius: 5px; color: var(--tinte-3); border: 1px solid var(--linie); line-height: 16px; white-space: nowrap; }
.tag { color: var(--gut); }

  // ---------------------------------------------------------------- Laden
  function fehlerAus(status, rumpf) {
    const f = rumpf && typeof rumpf === 'object' ? rumpf.fehler : null;
    if (status === 401 || f === 'schluessel') return { titel: t('fSchluessel'), text: t('fSchluesselText'), knopf: 'zugang' };
    if (status === 403 || f === 'herkunft') return { titel: t('fHerkunft'), text: t('fHerkunftText') };
    if (f === 'funktion_fehlt' || status === 501) return { titel: t('fFunktion'), text: t('fFunktionText') };
    if (f === 'nicht_eingerichtet' || status === 503) return { titel: t('fEinrichten'), text: t('fEinrichtenText') };
    if (status === 404) return { titel: t('fNichtDa'), text: t('fNichtDaText'), knopf: 'zugang' };
    return { titel: t('fAbfrage'), text: t('fAbfrageText', { code: (rumpf && rumpf.code) || ('HTTP ' + status) }) };
  }

  function gueltig(j) {
    return j && j.version === 1 && Array.isArray(j.tage) && j.tage.length > 0 && j.jetzt && typeof j.jetzt === 'object';

  async function laden() {

      const r = await fetch(adresse, {
        method: 'GET', cache: 'no-store', signal: abbruch.signal,
        headers: { 'x-dashboard-schluessel': zugang.schluessel },
      });
      let rumpf = null;
      try { rumpf = await r.json(); } catch (_) { rumpf = null; }
      if (nr !== laufNr) return;
      if (!r.ok) { fehler = fehlerAus(r.status, rumpf); }
      else if (!gueltig(rumpf)) { fehler = { titel: t('fFormat'), text: t('fFormatText') }; }
      else { daten = rumpf; echt = true; fehler = null; }
    } catch (e) {
      if (nr !== laufNr) return;
      if (e && e.name === 'AbortError') fehler = { titel: t('fZeit'), text: t('fZeitText') };
      else if (navigator.onLine === false) fehler = { titel: t('fOffline'), text: t('fOfflineText') };
      else fehler = { titel: t('fNetz'), text: t('fNetzText'), knopf: 'zugang' };

  // Mini-Saeulen fuer eine Kachel; heute in Akzentfarbe

  function paar(name, wert, klein) {

  // Geschlecht (145, jetzt.geschlecht). null: konto_geschlecht fehlt, 145 ist
  // noch nicht eingespielt. Feld ganz weg: dashboard_rechnen ist noch die
  // Fassung ohne Geschlecht, 144 neu einspielen. Dann jeweils nur der Hinweis.
  const G_TEILE = [['m', 'gM', 'var(--mann)'], ['w', 'gW', 'var(--frau)'], ['d', 'gD', 'var(--divers)'], ['ohne', 'gOhne', 'var(--ohne)']];
  function geschlechtKarte(j) {
    const g = j.geschlecht;
    const k = el('div', { class: 'karte breit' });
    const kopf = el('div', { class: 'g-kopf' }, el('h3', { text: t('gTitel') }));
    k.append(kopf);
    const gruppen = [['alle', 'gAlle'], ['aktiv_30_tage', 'gAktiv'], ['zahlende', 'gZahlende']]
      .filter(([s]) => g && g[s] && typeof g[s] === 'object');
    if (!gruppen.length) {
      k.append(el('p', { class: 'g-leer', text: t(g === null ? 'gLeer' : 'gFehlt144') }));
      return k;
    }
    const n = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
    // Nach dem Erstbefuellen fehlen nur die Konten seit dem letzten Lauf (alle
    // 5 Minuten), erfasst liegt also fast immer knapp unter konten_mit_stand.
    // Der Hinweis kommt deshalb erst ab 1 % Rueckstand.
    const erfasst = n(g.erfasst), mitStand = n(g.konten_mit_stand);
    if (mitStand > 0 && erfasst < mitStand * 0.99) {
      kopf.append(el('p', { class: 'g-hinweis zahl', text: t('gLaeuft', { a: z(erfasst), b: z(mitStand) }) }));
    }
    const box = el('div', { class: 'g-gruppen' });
    for (const [schluessel, name] of gruppen) {
      const werte = Object.fromEntries(G_TEILE.map(([s]) => [s, n(g[schluessel][s])]));
      const gesamt = summe(werte);
      const mitAngabe = werte.m + werte.w + werte.d;
      const gr = el('div', { class: 'g-gruppe' });
      gr.append(el('div', { class: 'g-name' }, [el('h4', { text: t(name) }), el('span', { class: 'zahl', text: z(gesamt) })]));

      // Balken: Breite nach Anzahl, 2px Luft zwischen den Teilen
      const huelle = el('div', { class: 'g-huelle' });
      const balken = el('div', {
        class: 'g-balken' + (gesamt ? '' : ' leer'), role: 'img',
        'aria-label': t(name) + ': ' + G_TEILE.map(([s, tx]) => t(tx) + ' ' + z(werte[s])).join(', '),
      });
      for (const [s, tx, farbe] of G_TEILE) {
        if (!werte[s]) continue;
        const teil = el('i');
        teil.style.flexGrow = String(werte[s]);
        teil.style.background = farbe;
        const zeigen = () => {
          let tp = huelle.querySelector('.tipp');
          if (!tp) { tp = el('div', { class: 'tipp', 'aria-hidden': 'true' }); huelle.append(tp); }
          const zeilen = [[t('gAnzahl'), z(werte[s])], [t('gVonAllen'), prozent(werte[s], gesamt)]];
          if (s !== 'ohne') zeilen.push([t('gMitAngabe'), prozent(werte[s], mitAngabe)]);
          tp.replaceChildren(el('b', { text: t(tx) }), ...zeilen.map(([a, b]) => el('div', null, [el('span', { text: a }), el('span', { text: b })])));
          tp.hidden = false; // erst zeigen, dann messen (versteckt ist offsetWidth 0)
          const B = huelle.clientWidth, tw = tp.offsetWidth || 150;
          const mitte = teil.offsetLeft + teil.offsetWidth / 2;
          tp.style.left = Math.max(0, Math.min(B - tw, mitte - tw / 2)) + 'px';
          tp.style.top = '20px';
        };
        teil.addEventListener('pointerenter', zeigen);
        teil.addEventListener('pointerdown', zeigen);
        balken.append(teil);
      }
      huelle.addEventListener('pointerleave', () => { const tp = huelle.querySelector('.tipp'); if (tp) tp.hidden = true; });
      huelle.append(balken);
      gr.append(huelle);

      // Zahlen: Anzahl, Anteil an allen, Anteil unter denen mit Angabe
      const zeile = ([s, tx, farbe]) => {
        const farbfeld = el('i', { class: 'g-farbe', 'aria-hidden': 'true' });
        farbfeld.style.background = farbe;
        return el('tr', null, [
          el('th', { scope: 'row' }, [farbfeld, t(tx)]),
          el('td', { text: z(werte[s]), class: werte[s] ? null : 'null' }),
          el('td', { text: prozent(werte[s], gesamt), class: werte[s] ? null : 'null' }),
          el('td', { text: s === 'ohne' ? '' : prozent(werte[s], mitAngabe), class: werte[s] ? null : 'null' }),
        ]);
      };
      gr.append(el('div', { class: 'g-tabelle tabelle-huelle' }, el('table', null, [
        el('thead', null, el('tr', null, ['', t('gAnzahl'), t('gVonAllen'), t('gMitAngabe')].map(x => el('th', { text: x, scope: 'col' })))),
        el('tbody', null, G_TEILE.map(zeile)),
      ])));
      box.append(gr);
    }
    k.append(box);
    return k;
  }

  // ---------------------------------------------------------------- Diagramme
  function tippZeigen(huelle, x, zeilen, titel) {
    let tp = huelle.querySelector('.tipp');
    if (!tp) { tp = el('div', { class: 'tipp', role: 'status' }); huelle.append(tp); }
    tp.replaceChildren(el('b', { text: titel }), ...zeilen.map(([n, w]) => el('div', null, [el('span', { text: n }), el('span', { text: z(w) })])));
    const B = huelle.clientWidth, tw = tp.offsetWidth || 150;
    tp.style.left = Math.max(0, Math.min(B - tw, x - tw / 2)) + 'px';
    tp.style.top = '-6px';
    tp.hidden = false;
  }
  function tippWeg(huelle) { const tp = huelle.querySelector('.tipp'); if (tp) tp.hidden = true; }

  // Gemeinsames Achsenkreuz: Raster, y-Beschriftung, Tage unten, Treffflaechen
  function achsen(svg, tage, B, H, R, max, beiTipp, huelle) {
    const L = 34, O = 10, U = 24;
    const iw = B - L - R, ih = H - O - U, n = tage.length, bw = iw / n;
    const y = (v) => O + ih - (v / max) * ih;
    for (const v of [0, max / 2, max]) {
      svg.append(sv('line', { x1: L, x2: B - R, y1: y(v), y2: y(v), stroke: 'var(--linie)', 'stroke-width': 1 }));
      const tx = sv('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' });
      tx.textContent = z(v);
      svg.append(tx);
    }
    const jedes = Math.max(1, Math.ceil(26 / bw));
    tage.forEach((d, i) => {
      if ((n - 1 - i) % jedes === 0) {
        const tx = sv('text', { x: L + i * bw + bw / 2, y: H - 6, 'text-anchor': 'middle' });
        tx.textContent = tagZahl(d.tag);
        if (i === n - 1) { tx.style.fill = 'var(--tinte)'; tx.style.fontWeight = '700'; }
        svg.append(tx);
      }
    });
    tage.forEach((d, i) => {
      const r = sv('rect', { x: L + i * bw, y: O, width: bw, height: ih, fill: 'transparent' });
      r.style.cursor = 'default';
      r.addEventListener('pointerenter', () => beiTipp(i, L + i * bw + bw / 2));
      r.addEventListener('pointerdown', () => beiTipp(i, L + i * bw + bw / 2));
      svg.append(r);
    });
    svg.addEventListener('pointerleave', () => tippWeg(huelle));
    return { L, O, U, iw, ih, bw, y };
  }

  function stapel(huelle, tage) {
    huelle.replaceChildren();
    const B = Math.max(260, huelle.clientWidth || 600), H = 210, R = 6;
    const max = schoenMax(Math.max(1, ...tage.map(d => d.konten_neu)));
    const svg = sv('svg', { width: B, height: H, viewBox: `0 0 ${B} ${H}`, role: 'img', 'aria-label': t('d1') });
    const teile = [['ios', 'var(--ios)'], ['android', 'var(--android)'], ['unbekannt', 'var(--ohne)']];
    const tipp = (i, x) => {
      const d = tage[i];
      tippZeigen(huelle, x, [[t('ios'), d.plattform.ios], [t('android'), d.plattform.android], [t('ohnePush'), d.plattform.unbekannt], [t('gesamt'), d.konten_neu]], tagKurz(d.tag));
    };
    const a = achsen(svg, tage, B, H, R, max, tipp, huelle);
    const breite = Math.max(4, Math.min(26, a.bw * 0.64));
    const marken = sv('g');
    tage.forEach((d, i) => {
      let unten = a.O + a.ih;
      const x = a.L + i * a.bw + (a.bw - breite) / 2;
      const sichtbar = teile.filter(([k]) => d.plattform[k] > 0);
      sichtbar.forEach(([k, farbe], s) => {
        const h = (d.plattform[k] / max) * a.ih;
        const oben = s === sichtbar.length - 1;
        // 2px Luft zwischen den Teilen, oben runde Ecken
        const hh = Math.max(1, h - (s > 0 ? 2 : 0));
        const p = sv('path', { d: oben ? saeule(x, unten - h, breite, hh, 4) : `M${x},${unten}V${unten - hh}H${x + breite}V${unten}Z` });
        p.style.fill = farbe;
        marken.append(p);
        unten -= h;
      });
    });
    svg.insertBefore(marken, svg.querySelector('rect'));
    huelle.append(svg);
  }

  function linien(huelle, tage) {
    huelle.replaceChildren();
    const B = Math.max(260, huelle.clientWidth || 600), H = 210, R = 10;
    const reihen = [
      { name: t('starts'), farbe: 'var(--tinte-2)', werte: tage.map(d => summe(d.abos_neu)) },
      { name: t('zahlungen'), farbe: 'var(--akzent-zeichen)', werte: tage.map(d => summe(d.erste_zahlungen)) },
    ];
    const max = schoenMax(Math.max(1, ...reihen.flatMap(r => r.werte)));
    const svg = sv('svg', { width: B, height: H, viewBox: `0 0 ${B} ${H}`, role: 'img', 'aria-label': t('d2') });
    const tipp = (i, x) => tippZeigen(huelle, x, reihen.map(r => [r.name, r.werte[i]]).concat([[t('proben'), summe(tage[i].proben_neu)]]), tagKurz(tage[i].tag));
    const a = achsen(svg, tage, B, H, R, max, tipp, huelle);
    const g = sv('g');
    for (const r of reihen) {
      const pkt = r.werte.map((v, i) => [a.L + i * a.bw + a.bw / 2, a.y(v)]);
      const pfad = sv('path', { d: 'M' + pkt.map(p => p.map(v => v.toFixed(1)).join(',')).join('L'), fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
      pfad.style.stroke = r.farbe;
      g.append(pfad);
      const [lx, ly] = pkt[pkt.length - 1];
      const c = sv('circle', { cx: lx, cy: ly, r: 4.5, 'stroke-width': 2 });
      c.style.fill = r.farbe; c.style.stroke = 'var(--flaeche)';
      g.append(c);
    }
    svg.insertBefore(g, svg.querySelector('rect'));
    huelle.append(svg);
  }

  function legende(box, eintraege, strich) {
    box.replaceChildren(...eintraege.map(([n, f]) => {
      const i = el('i', { class: strich ? 'strich' : null }); i.style.background = f;
      return el('span', null, [i, n]);
    }));
  }

  function renderVerlauf() {
    if (!daten) return;
    const tage = daten.tage;
    $('verlauf-neben').textContent = t('verlaufNeben', { n: tage.length });

    const spalten = [
      [t('tag'), d => tagKurz(d.tag)],
      [t('kontenNeu'), d => d.konten_neu], [t('ios'), d => d.plattform.ios], [t('android'), d => d.plattform.android], [t('ohnePush'), d => d.plattform.unbekannt],
      [t('aboStarts'), d => summe(d.abos_neu)], [t('proben'), d => summe(d.proben_neu)], [t('ersteZahlung'), d => summe(d.erste_zahlungen)],
      [t('kuendigungen'), d => summe(d.kuendigungen)], [t('lifetime'), d => d.lifetime], [t('erstattungen'), d => d.erstattungen],
      [t('feedKurz'), d => d.feed_trainings], [t('rueckKurz'), d => d.rueckmeldungen], [t('loseKurz'), d => d.lose],
    ].filter(([, f], i) => i === 0 || tage.some(d => f(d) != null));
    const tab = el('table', null, [
      el('thead', null, el('tr', null, spalten.map(([n]) => el('th', { text: n, scope: 'col' })))),
      el('tbody', null, tage.slice().reverse().map(d => el('tr', null, spalten.map(([, f], i) => {
        const v = f(d);
        return el('td', { text: i ? z(v) : v, class: i && !v ? 'null' : null });
      })))),
    ]);
    $('tagestabelle').replaceChildren(tab);

  // ---------------------------------------------------------------- Rahmen
  function renderKopf() {
    const chip = $('chip');
    let artChip = 'beispiel';
    if (laedt) artChip = 'laedt';
    else if (fehler && echt) artChip = 'alt';

    else if (echt) artChip = 'live';

    $('datum').textContent = daten ? tagLang(daten.datum) : '';
    standZeigen();
    $('neu').disabled = laedt || !zugang;

    const m = $('meldung');
    m.replaceChildren();
    if (fehler) {
      m.dataset.art = 'fehler';
      m.append(el('strong', { text: fehler.titel }), el('p', { text: fehler.text }));
      if (echt) m.append(el('p', { text: t('fAlt') }));

        m.append(el('div', { class: 'knopfreihe' }, b));
      }
      m.hidden = false;

      m.dataset.art = 'beispiel';

      m.hidden = false;
    } else if (!echt) {
      m.dataset.art = 'beispiel';
      m.setAttribute('role', 'status');
      m.append(el('strong', { text: t('beispielTitel') }), el('p', { text: t('beispielText') }));
      m.hidden = false;
    } else {
      m.hidden = true;
    }
    if (fehler) m.setAttribute('role', 'alert');

  function standZeigen() {
    const s = $('stand');
    if (!daten || !echt) { s.textContent = zugang && !echt ? t('standNie') : ''; return; }
    const rest = Math.max(0, TAKT - Math.round((Date.now() - geladenAm) / 1000));
    s.textContent = zugang && !laedt ? t('standNaechst', { zeit: zeit(daten.stand), s: rest }) : t('stand', { zeit: zeit(daten.stand) });
  }

  function render() {
    if (!daten) daten = beispiel();

    $('inhalt').hidden = !!zugang && !echt;
    renderKopf();
    renderKacheln();
    renderBestand();
    renderVerlauf();

  // ---------------------------------------------------------------- Zugang
  function zugangOeffnen() {

    const r = await crSenden({ aktion: 'auszahlung', id: c.id, bis_monat: bis, betrag_cent: f, notiz: notiz || null });
    crSendet(Z.d, false);
    if (r.ok) {
      const a = r.daten.auszahlung && typeof r.daten.auszahlung === 'object' ? r.daten.auszahlung : {};
      dlgZu(Z.d);
      crErfolg(t('crAuszOk', { name: c.name, monat: monatLang(bis), betrag: eur(Number.isFinite(a.betrag_cent) ? a.betrag_cent : f) }));
      crLaden();
      return;
    }
    const x = crFehlerText(r);
    crMeldung(Z.fehler, x.text);
    crAuszAuffrischen();
    if (x.neuLaden) crLaden();
  });
  const crAuszZu = () => { if (Z.d.dataset.sendet !== '1') dlgZu(Z.d); };
  $('cr-z-abbrechen').addEventListener('click', crAuszZu);
  $('cr-z-zu').addEventListener('click', crAuszZu);

  // ---------------------------------------------------------------- Creator: Texte und Ausloeser
  $('creator-link').textContent = t('crLink');
  $('h-creator').textContent = t('crTitel');
  $('cr-nur-du').textContent = t('crNurDu');
  $('cr-neu-knopf').textContent = t('crAnlegenKnopf');
  $('h-cr-ueberblick').textContent = t('crUeberblick');
  $('h-cr-karten').textContent = t('crKarten');
  $('h-cr-ausz').textContent = t('crAuszListe');
  $('cr-csv').textContent = t('crCsv');
  $('cr-wie-titel').textContent = t('crWie');
  $('cr-a-titel').textContent = t('crAnlegenTitel');
  $('cr-a-name-label').textContent = t('crName');
  $('cr-a-handle-label').textContent = t('crHandle');
  $('cr-a-code-label').textContent = t('crCode');
  $('cr-a-code-hinweis').textContent = t('crCodeHinweis');
  $('cr-a-rabatt-label').textContent = t('crRabatt');
  $('cr-a-prov-jahr-label').textContent = t('crProvJahr');
  $('cr-a-prov-monat-label').textContent = t('crProvMonat');
  $('cr-a-notiz-label').textContent = t('crNotizFeld');
  $('cr-a-profil-label').textContent = t('crProfilHaken');
  $('cr-a-senden').textContent = t('crAnlegenSenden');
  $('cr-a-abbrechen').textContent = t('crAbbrechen');
  $('cr-z-titel').textContent = t('crAuszTitel');
  $('cr-z-monat-label').textContent = t('crBisMonat');
  $('cr-z-faellig-label').textContent = t('crFaellig');
  $('cr-z-notiz-label').textContent = t('crNotizAusz');
  $('cr-z-notiz').setAttribute('placeholder', t('crNotizAuszPlatz'));
  $('cr-z-ok-label').textContent = t('crUeberwiesen');
  $('cr-z-senden').textContent = t('crAuszSenden');
  $('cr-z-abbrechen').textContent = t('crAbbrechen');
  $('cr-f-nein').textContent = t('crAbbrechen');
  $('cr-a-zu').setAttribute('aria-label', t('crSchliessen'));
  $('cr-z-zu').setAttribute('aria-label', t('crSchliessen'));

  $('cr-neu-knopf').addEventListener('click', () => crAnlegenOeffnen($('cr-neu-knopf')));
  // Laden: beim Start nach dem ersten laden() (siehe unten), bei "Neu laden",
  // nach jeder Aktion, bei neuem Zugang und wenn der Tab nach ueber 5 Minuten wieder sichtbar wird
  $('neu').addEventListener('click', () => crLaden());
  $('zugang').addEventListener('submit', () => {
    if (zugang && zugang !== crZugang) { crZugang = zugang; crDaten = null; crIx = null; crEcht = false; crFehler = null; crLaden(); }
  });
  $('vergessen').addEventListener('click', () => { crZugang = null; crDaten = null; crIx = null; crEcht = false; crFehler = null; crLaden(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && zugang && !crLaedt && Date.now() - crGeladenAm > CR_NEU_MS) crLaden();
  });
  renderCreator();

  // ---------------------------------------------------------------- Takt
  setInterval(() => {
    standZeigen();
    if (!zugang || laedt || document.visibilityState !== 'visible') return;
    if (Date.now() - geladenAm >= TAKT * 1000) laden();
  }, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && zugang && !laedt && Date.now() - geladenAm >= TAKT * 1000) laden();
  });
  let breiteVorher = 0;
  const ro = new ResizeObserver(() => {
    const b = $('d1').clientWidth;
    if (daten && Math.abs(b - breiteVorher) > 2) { breiteVorher = b; renderVerlauf(); }
  });
  ro.observe($('d1'));

  render();
  if (zugang) laden().finally(crLaden); else { zugangOeffnen(); crLaden(); }
})();
</script>
