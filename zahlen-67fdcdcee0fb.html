}

* { box-sizing: border-box; }
body {

.marke { display: grid; gap: 2px; min-width: 0; }
.marke h1 {

.stand { color: var(--tinte-2); font-size: 13px; }
.chip {

}
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

.chip[data-art="beispiel"] { color: var(--warn); }
.chip[data-art="alt"] { color: var(--warn); }
.knopf {

  padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600;

.knopf:hover { border-color: var(--tinte-3); }
.knopf[disabled] { opacity: .55; cursor: default; }

  padding: 18px; display: grid; gap: 14px; max-width: 640px;

.ins .name { font-size: 13px; font-weight: 600; color: var(--tinte-2); }

.ins-schalter::after {
  content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0;

.ins-schalter[aria-expanded="true"]::after { transform: translateY(1px) rotate(-135deg); }

      const k = 13 - i;

  // ---------------------------------------------------------------- Laden
  function fehlerAus(status, rumpf) {
    const f = rumpf && typeof rumpf === 'object' ? rumpf.fehler : null;
    if (status === 401 || f === 'schluessel') return { titel: t('fSchluessel'), text: t('fSchluesselText'), knopf: 'zugang' };
    if (status === 403 || f === 'herkunft') return { titel: t('fHerkunft'), text: t('fHerkunftText') };
    if (f === 'funktion_fehlt' || status === 501) return { titel: t('fFunktion'), text: t('fFunktionText') };
    if (f === 'nicht_eingerichtet' || status === 503) return { titel: t('fEinrichten'), text: t('fEinrichtenText') };
    if (status === 404) return { titel: t('fNichtDa'), text: t('fNichtDaText'), knopf: 'zugang' };
    return { titel: t('fAbfrage'), text: t('fAbfrageText', { code: (rumpf && rumpf.code) || ('HTTP ' + status) }) };
  }

  function gueltig(j) {
    return j && j.version === 1 && Array.isArray(j.tage) && j.tage.length > 0 && j.jetzt && typeof j.jetzt === 'object';
  }

  async function laden() {
    if (!zugang) { render(); return; }
    const nr = ++laufNr;
    laedt = true; render();
    const abbruch = new AbortController();
    const uhr = setTimeout(() => abbruch.abort(), 20000);
    try {
      const adresse = zugang.url + (zugang.url.includes('?') ? '&' : '?') + 'tage=' + TAGE;
      const r = await fetch(adresse, {
        method: 'GET', cache: 'no-store', signal: abbruch.signal,
        headers: { 'x-dashboard-schluessel': zugang.schluessel },
      });
      let rumpf = null;
      try { rumpf = await r.json(); } catch (_) { rumpf = null; }
      if (nr !== laufNr) return;
      if (!r.ok) { fehler = fehlerAus(r.status, rumpf); }
      else if (!gueltig(rumpf)) { fehler = { titel: t('fFormat'), text: t('fFormatText') }; }
      else { daten = rumpf; echt = true; fehler = null; }
    } catch (e) {
      if (nr !== laufNr) return;
      if (e && e.name === 'AbortError') fehler = { titel: t('fZeit'), text: t('fZeitText') };
      else if (navigator.onLine === false) fehler = { titel: t('fOffline'), text: t('fOfflineText') };
      else fehler = { titel: t('fNetz'), text: t('fNetzText'), knopf: 'zugang' };
    } finally {
      clearTimeout(uhr);
      if (nr === laufNr) { laedt = false; geladenAm = Date.now(); render(); }
    }
  }

  // ---------------------------------------------------------------- Helfer

  const tagLang = (s) => new Intl.DateTimeFormat(ORT, { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(tagDatum(s));

  // Mini-Saeulen fuer eine Kachel; heute in Akzentfarbe

  // ---------------------------------------------------------------- Kacheln

      r(d => summe(d.abos_neu))));
    box.append(kachel(t('ersteZahlung'), summe(h.erste_zahlungen), art(h.erste_zahlungen), r(d => summe(d.erste_zahlungen))));
    box.append(kachel(t('kuendigungen'), summe(h.kuendigungen), art(h.kuendigungen), r(d => summe(d.kuendigungen))));
    box.append(kachel(t('lifetime'), h.lifetime, h.geschenke_lifetime ? t('geschenkt', { n: z(h.geschenke_lifetime) }) : '', r(d => d.lifetime)));
    box.append(kachel(t('erstattungen'), h.erstattungen, '', r(d => d.erstattungen)));
    if (h.feed_trainings != null) box.append(kachel(t('feed'), h.feed_trainings, t('vonKonten', { n: z(h.feed_konten) }), r(d => d.feed_trainings || 0)));
    if (h.rueckmeldungen != null) box.append(kachel(t('rueckmeldungen'), h.rueckmeldungen,
      j.rueckmeldungen_offen != null ? t('offen', { n: z(j.rueckmeldungen_offen) }) : '', r(d => d.rueckmeldungen || 0)));
    if (h.lose != null) {
      const g = j.gewinnspiel_heute;
      box.append(kachel(t('lose'), h.lose, g ? t('losTeil', { a: z(g.bestaetigt), b: z(g.abgelehnt), c: z(g.offen) }) : '', r(d => d.lose || 0)));
    }
  }

  // ---------------------------------------------------------------- Bestand
  function paar(name, wert, klein) {
    return el('div', null, [el('dt', { text: name }), el('dd', { class: 'zahl' }, [z(wert), klein ? el('small', { text: klein }) : null])]);
  }

  function renderBestand() {
    const box = $('bestand');
    box.replaceChildren();
    if (!daten) return;
    const j = daten.jetzt;

    const k1 = el('div', { class: 'karte' });
    k1.append(el('h3', { text: t('ueberblick') }));
    k1.append(el('dl', { class: 'paare' }, [
      paar(t('konten'), j.konten),
      paar(t('proGesamt'), j.pro, j.pro_nur_werbung ? t('nurWerbung', { n: z(j.pro_nur_werbung) }) : ''),
      paar(t('aktiv7'), j.aktiv_7_tage),
      paar(t('aktiv30'), j.aktiv_30_tage),
      paar(t('lifetimeGesamt'), j.lifetime, j.lifetime_geschenkt ? t('geschenkt', { n: z(j.lifetime_geschenkt) }) : ''),
      paar(t('zahlend'), j.zahlende.gesamt),
    ]));
    box.append(k1);

    const k2 = el('div', { class: 'karte' });
    k2.append(el('h3', { text: t('abos') }));
    const store = {};
    for (const s of j.zahlende_je_store || []) store[s.art + '/' + s.store] = (store[s.art + '/' + s.store] || 0) + s.anzahl;
    const zeile = (name, a, cls) => {
      const ap = a ? (store[a + '/apple'] || 0) : ['monat', 'quartal', 'jahr'].reduce((s, x) => s + (store[x + '/apple'] || 0), 0);
      const pl = a ? (store[a + '/play'] || 0) : ['monat', 'quartal', 'jahr'].reduce((s, x) => s + (store[x + '/play'] || 0), 0);
      const za = a ? j.zahlende[a] : j.zahlende.gesamt;
      const pr = a ? j.probe_laeuft[a] : j.probe_laeuft.gesamt;
      return el('tr', { class: cls }, [name, za, ap, pl, pr].map((v, i) => el('td', { text: i ? z(v) : v, class: i && !v ? 'null' : null })));
    };
    const tab = el('table', null, [
      el('thead', null, el('tr', null, ['', t('zahlend'), t('apple'), t('play'), t('probeLaeuft')].map(x => el('th', { text: x, scope: 'col' })))),
      el('tbody', null, [zeile(t('jahr'), 'jahr'), zeile(t('quartal'), 'quartal'), zeile(t('monat'), 'monat'), zeile(t('gesamt'), null, 'summe')]),
    ]);
    k2.append(el('div', { class: 'tabelle-huelle' }, tab));
    k2.append(el('p', { class: 'klein zahl', text: t('gekuendigtLaeuft', { a: z(j.gekuendigt_laeuft_aus), b: z(j.probe_gekuendigt) }) }));
    box.append(k2);

    const k3 = el('div', { class: 'karte' });
    k3.append(el('h3', { text: t('mehr') }));
    const liste = el('ul', { class: 'liste' });
    if (j.rueckmeldungen_offen != null) liste.append(el('li', null, [el('span', { text: t('rueckOffen') }), el('span', { text: z(j.rueckmeldungen_offen) })]));
    if (j.gewinnspiel_heute) liste.append(el('li', null, [el('span', { text: t('gewinnspielHeute') }), el('span', { text: z(j.gewinnspiel_heute.lose) })]));
    const heute = daten.heute || daten.tage[daten.tage.length - 1];
    liste.append(el('li', null, [el('span', { text: t('proGeschenkt') }), el('span', { text: z(heute.geschenke_pro) })]));
    k3.append(liste);
    if (j.verbunden) {
      k3.append(el('h3', { text: t('verbunden') }));
      const namen = { whoop: 'WHOOP', strava: 'Strava', polar: 'Polar', garmin: 'Garmin', coros: 'COROS', suunto: 'Suunto' };
      const v = Object.entries(j.verbunden).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
      const l2 = el('ul', { class: 'liste' });
      if (!v.length) l2.append(el('li', null, [el('span', { text: t('keineVerbunden') }), el('span', { text: '0' })]));
      for (const [k, n] of v) l2.append(el('li', null, [el('span', { text: namen[k] || k }), el('span', { text: z(n) })]));
      k3.append(l2);
      if (j.verbunden_neu_heute) k3.append(el('p', { class: 'klein', text: t('verbundenNeu', { n: z(j.verbunden_neu_heute) }) }));
    }
    if (Array.isArray(daten.fehlt) && daten.fehlt.length) k3.append(el('p', { class: 'klein', text: t('fehlt', { liste: daten.fehlt.join(', ') }) }));
    box.append(k3);
  }

  // ---------------------------------------------------------------- Diagramme
  function tippZeigen(huelle, x, zeilen, titel) {
    let tp = huelle.querySelector('.tipp');
    if (!tp) { tp = el('div', { class: 'tipp', role: 'status' }); huelle.append(tp); }
    tp.replaceChildren(el('b', { text: titel }), ...zeilen.map(([n, w]) => el('div', null, [el('span', { text: n }), el('span', { text: z(w) })])));
    const B = huelle.clientWidth, tw = tp.offsetWidth || 150;
    tp.style.left = Math.max(0, Math.min(B - tw, x - tw / 2)) + 'px';
    tp.style.top = '-6px';
    tp.hidden = false;
  }
  function tippWeg(huelle) { const tp = huelle.querySelector('.tipp'); if (tp) tp.hidden = true; }

  // Gemeinsames Achsenkreuz: Raster, y-Beschriftung, Tage unten, Treffflaechen
  function achsen(svg, tage, B, H, R, max, beiTipp, huelle) {
    const L = 34, O = 10, U = 24;
    const iw = B - L - R, ih = H - O - U, n = tage.length, bw = iw / n;
    const y = (v) => O + ih - (v / max) * ih;
    for (const v of [0, max / 2, max]) {
      svg.append(sv('line', { x1: L, x2: B - R, y1: y(v), y2: y(v), stroke: 'var(--linie)', 'stroke-width': 1 }));
      const tx = sv('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end' });
      tx.textContent = z(v);
      svg.append(tx);
    }
    const jedes = Math.max(1, Math.ceil(26 / bw));
    tage.forEach((d, i) => {
      if ((n - 1 - i) % jedes === 0) {
        const tx = sv('text', { x: L + i * bw + bw / 2, y: H - 6, 'text-anchor': 'middle' });
        tx.textContent = tagZahl(d.tag);
        if (i === n - 1) { tx.style.fill = 'var(--tinte)'; tx.style.fontWeight = '700'; }
        svg.append(tx);
      }
    });
    tage.forEach((d, i) => {
      const r = sv('rect', { x: L + i * bw, y: O, width: bw, height: ih, fill: 'transparent' });
      r.style.cursor = 'default';
      r.addEventListener('pointerenter', () => beiTipp(i, L + i * bw + bw / 2));
      r.addEventListener('pointerdown', () => beiTipp(i, L + i * bw + bw / 2));
      svg.append(r);
    });
    svg.addEventListener('pointerleave', () => tippWeg(huelle));
    return { L, O, U, iw, ih, bw, y };
  }

  function stapel(huelle, tage) {
    huelle.replaceChildren();
    const B = Math.max(260, huelle.clientWidth || 600), H = 210, R = 6;
    const max = schoenMax(Math.max(1, ...tage.map(d => d.konten_neu)));
    const svg = sv('svg', { width: B, height: H, viewBox: `0 0 ${B} ${H}`, role: 'img', 'aria-label': t('d1') });
    const teile = [['ios', 'var(--ios)'], ['android', 'var(--android)'], ['unbekannt', 'var(--ohne)']];
    const tipp = (i, x) => {
      const d = tage[i];
      tippZeigen(huelle, x, [[t('ios'), d.plattform.ios], [t('android'), d.plattform.android], [t('ohnePush'), d.plattform.unbekannt], [t('gesamt'), d.konten_neu]], tagKurz(d.tag));
    };
    const a = achsen(svg, tage, B, H, R, max, tipp, huelle);
    const breite = Math.max(4, Math.min(26, a.bw * 0.64));
    const marken = sv('g');
    tage.forEach((d, i) => {
      let unten = a.O + a.ih;
      const x = a.L + i * a.bw + (a.bw - breite) / 2;
      const sichtbar = teile.filter(([k]) => d.plattform[k] > 0);
      sichtbar.forEach(([k, farbe], s) => {
        const h = (d.plattform[k] / max) * a.ih;
        const oben = s === sichtbar.length - 1;
        // 2px Luft zwischen den Teilen, oben runde Ecken
        const hh = Math.max(1, h - (s > 0 ? 2 : 0));
        const p = sv('path', { d: oben ? saeule(x, unten - h, breite, hh, 4) : `M${x},${unten}V${unten - hh}H${x + breite}V${unten}Z` });
        p.style.fill = farbe;
        marken.append(p);
        unten -= h;
      });
    });
    svg.insertBefore(marken, svg.querySelector('rect'));
    huelle.append(svg);
  }

  function linien(huelle, tage) {
    huelle.replaceChildren();
    const B = Math.max(260, huelle.clientWidth || 600), H = 210, R = 10;
    const reihen = [
      { name: t('starts'), farbe: 'var(--tinte-2)', werte: tage.map(d => summe(d.abos_neu)) },
      { name: t('zahlungen'), farbe: 'var(--akzent-zeichen)', werte: tage.map(d => summe(d.erste_zahlungen)) },
    ];
    const max = schoenMax(Math.max(1, ...reihen.flatMap(r => r.werte)));
    const svg = sv('svg', { width: B, height: H, viewBox: `0 0 ${B} ${H}`, role: 'img', 'aria-label': t('d2') });
    const tipp = (i, x) => tippZeigen(huelle, x, reihen.map(r => [r.name, r.werte[i]]).concat([[t('proben'), summe(tage[i].proben_neu)]]), tagKurz(tage[i].tag));
    const a = achsen(svg, tage, B, H, R, max, tipp, huelle);
    const g = sv('g');
    for (const r of reihen) {
      const pkt = r.werte.map((v, i) => [a.L + i * a.bw + a.bw / 2, a.y(v)]);
      const pfad = sv('path', { d: 'M' + pkt.map(p => p.map(v => v.toFixed(1)).join(',')).join('L'), fill: 'none', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
      pfad.style.stroke = r.farbe;
      g.append(pfad);
      const [lx, ly] = pkt[pkt.length - 1];
      const c = sv('circle', { cx: lx, cy: ly, r: 4.5, 'stroke-width': 2 });
      c.style.fill = r.farbe; c.style.stroke = 'var(--flaeche)';
      g.append(c);
    }
    svg.insertBefore(g, svg.querySelector('rect'));
    huelle.append(svg);
  }

  function legende(box, eintraege, strich) {
    box.replaceChildren(...eintraege.map(([n, f]) => {
      const i = el('i', { class: strich ? 'strich' : null }); i.style.background = f;
      return el('span', null, [i, n]);
    }));
  }

  function renderVerlauf() {
    if (!daten) return;
    const tage = daten.tage;
    $('verlauf-neben').textContent = t('verlaufNeben', { n: tage.length });
    legende($('d1-legende'), [[t('ios'), 'var(--ios)'], [t('android'), 'var(--android)'], [t('ohnePush'), 'var(--ohne)']]);
    legende($('d2-legende'), [[t('starts'), 'var(--tinte-2)'], [t('zahlungen'), 'var(--akzent-zeichen)']], true);
    stapel($('d1'), tage);
    linien($('d2'), tage);

    // Tagestabelle, neuester Tag oben; Spalten ohne Daten fallen weg
    const spalten = [
      [t('tag'), d => tagKurz(d.tag)],
      [t('kontenNeu'), d => d.konten_neu], [t('ios'), d => d.plattform.ios], [t('android'), d => d.plattform.android], [t('ohnePush'), d => d.plattform.unbekannt],
      [t('aboStarts'), d => summe(d.abos_neu)], [t('proben'), d => summe(d.proben_neu)], [t('ersteZahlung'), d => summe(d.erste_zahlungen)],
      [t('kuendigungen'), d => summe(d.kuendigungen)], [t('lifetime'), d => d.lifetime], [t('erstattungen'), d => d.erstattungen],
      [t('feedKurz'), d => d.feed_trainings], [t('rueckKurz'), d => d.rueckmeldungen], [t('loseKurz'), d => d.lose],
    ].filter(([, f], i) => i === 0 || tage.some(d => f(d) != null));
    const tab = el('table', null, [
      el('thead', null, el('tr', null, spalten.map(([n]) => el('th', { text: n, scope: 'col' })))),
      el('tbody', null, tage.slice().reverse().map(d => el('tr', null, spalten.map(([, f], i) => {
        const v = f(d);
        return el('td', { text: i ? z(v) : v, class: i && !v ? 'null' : null });
      })))),
    ]);
    $('tagestabelle').replaceChildren(tab);
  }

  // ---------------------------------------------------------------- Rahmen
  function renderKopf() {
    const chip = $('chip');
    let artChip = 'beispiel';
    if (laedt) artChip = 'laedt';
    else if (fehler && echt) artChip = 'alt';
    else if (fehler) artChip = 'fehler';
    else if (echt) artChip = 'live';
    chip.dataset.art = artChip;
    chip.textContent = t({ laedt: 'chipLaedt', alt: 'chipAlt', fehler: 'chipFehler', live: 'chipLive', beispiel: 'chipBeispiel' }[artChip]);
    $('datum').textContent = daten ? tagLang(daten.datum) : '';
    standZeigen();
    $('neu').disabled = laedt || !zugang;

    const m = $('meldung');
    m.replaceChildren();
    if (fehler) {
      m.dataset.art = 'fehler';
      m.append(el('strong', { text: fehler.titel }), el('p', { text: fehler.text }));
      if (echt) m.append(el('p', { text: t('fAlt') }));
      if (fehler.knopf === 'zugang') {
        const b = el('button', { class: 'knopf', type: 'button', text: t('zugang') });
        b.addEventListener('click', () => zugangOeffnen());
        m.append(el('div', { class: 'knopfreihe' }, b));
      }
      m.hidden = false;
    } else if (!echt && zugang) {
      m.dataset.art = 'beispiel';
      m.setAttribute('role', 'status');
      m.append(el('strong', { text: t('ladenTitel') }), el('p', { text: t('ladenText') }));
      m.hidden = false;
    } else if (!echt) {
      m.dataset.art = 'beispiel';
      m.setAttribute('role', 'status');
      m.append(el('strong', { text: t('beispielTitel') }), el('p', { text: t('beispielText') }));
      m.hidden = false;
    } else {
      m.hidden = true;
    }
    if (fehler) m.setAttribute('role', 'alert');
  }

  function standZeigen() {
    const s = $('stand');
    if (!daten || !echt) { s.textContent = zugang && !echt ? t('standNie') : ''; return; }
    const rest = Math.max(0, TAKT - Math.round((Date.now() - geladenAm) / 1000));
    s.textContent = zugang && !laedt ? t('standNaechst', { zeit: zeit(daten.stand), s: rest }) : t('stand', { zeit: zeit(daten.stand) });
  }

  function render() {
    if (!daten) daten = beispiel();
    // Mit Zugang nie Beispielzahlen zeigen, nur echte oder nichts.
    $('inhalt').hidden = !!zugang && !echt;
    renderKopf();
    renderKacheln();
    renderBestand();
    renderVerlauf();
  }

  // ---------------------------------------------------------------- Zugang
  function zugangOeffnen() {
    const f = $('zugang');
    $('url').value = (zugang && zugang.url) || STANDARD_URL;
    $('schluessel').value = (zugang && zugang.schluessel) || '';
    $('zugang-hinweis').textContent = fluechtig ? t('zugangHinweisFluechtig') : t('zugangHinweis');
    $('abbrechen').hidden = !zugang;
    $('vergessen').hidden = !zugang;
    f.hidden = false;
    (zugang ? $('schluessel') : ($('url').value ? $('schluessel') : $('url'))).focus();
  }
  function zugangSchliessen() { $('zugang').hidden = true; }

  $('zugang').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const url = $('url').value.trim();
    const schluessel = $('schluessel').value.trim();
    if (!/^https:\/\//i.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i.test(url)) {
      $('zugang-hinweis').textContent = t('fUrl');
      $('url').focus();
      return;
    }
    if (!schluessel) { $('schluessel').focus(); return; }
    zugang = { url, schluessel };
    zugangSchreiben(zugang);
    zugangSchliessen();
    fehler = null;
    laden();
  });
  $('abbrechen').addEventListener('click', zugangSchliessen);
  $('vergessen').addEventListener('click', () => {
    zugangLoeschen();
    zugang = null; daten = null; echt = false; fehler = null;
    zugangOeffnen();
    render();
  });
  $('zugang-knopf').addEventListener('click', () => ($('zugang').hidden ? zugangOeffnen() : zugangSchliessen()));
  $('neu').addEventListener('click', () => laden());

  // ---------------------------------------------------------------- Texte
  $('titel-rest').textContent = t('titel');
  $('neu').textContent = t('neu');
  $('zugang-knopf').textContent = t('zugang');
  $('zugang-titel').textContent = t('zugangTitel');
  $('url-label').textContent = t('urlLabel');
  $('schluessel-label').textContent = t('schluesselLabel');
  $('speichern').textContent = t('speichern');
  $('abbrechen').textContent = t('abbrechen');
  $('vergessen').textContent = t('vergessen');
  $('h-heute').textContent = t('heute');
  $('h-bestand').textContent = t('bestand');
  $('h-verlauf').textContent = t('verlauf');
  $('d1-titel').textContent = t('d1');
  $('d2-titel').textContent = t('d2');
  $('tab-titel').textContent = t('tabelle');
  $('wie-titel').textContent = t('wie');
  $('wie-liste').replaceChildren(...['wie1', 'wie2', 'wie3', 'wie4', 'wie5', 'wie6', 'wie7'].map(k => el('li', { text: t(k) })));
  document.documentElement.lang = SPRACHE;

  // ---------------------------------------------------------------- Takt
  setInterval(() => {
    standZeigen();
    if (!zugang || laedt || document.visibilityState !== 'visible') return;
    if (Date.now() - geladenAm >= TAKT * 1000) laden();
  }, 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && zugang && !laedt && Date.now() - geladenAm >= TAKT * 1000) laden();
  });
  let breiteVorher = 0;
  const ro = new ResizeObserver(() => {
    const b = $('d1').clientWidth;
    if (daten && Math.abs(b - breiteVorher) > 2) { breiteVorher = b; renderVerlauf(); }
  });
  ro.observe($('d1'));

  render();
  if (zugang) laden(); else zugangOeffnen();
})();
</script>
